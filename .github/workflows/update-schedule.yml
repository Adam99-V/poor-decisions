name: Update club schedule

on:
  schedule:
    - cron: "0 8 * * *"   # every day 08:00 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape TAO Group guest list schedule
        run: python scripts/update_schedule.py

      - name: Commit if changed
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@github.com"
          git add schedule.json
          git diff --cached --quiet || git commit -m "Auto-update club schedule (guest list availability)"
          git push
