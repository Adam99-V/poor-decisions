name: Update club schedule

on:
  schedule:
    - cron: "0 7 * * *"   # every day 07:00 UTC, then a random wait of up to 100 min so the scrape time varies
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - name: Random wait (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          W=$(( RANDOM % 6000 ))
          echo "waiting $((W/60)) minutes"
          sleep $W

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install -q playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Scrape TAO Group guest list schedule
        run: python scripts/update_schedule.py

      - name: Commit if changed
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@github.com"
          git add schedule.json
          git diff --cached --quiet || git commit -m "Auto-update club schedule (guest list availability)"
          git push
